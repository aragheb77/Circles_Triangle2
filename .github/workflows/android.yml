name: Android CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Pin Gradle 8.10.2 (the Android Gradle Plugin 8.7.x does not work with Gradle 9)
      - name: Create Gradle 8.10.2 wrapper
        run: |
          mkdir -p /tmp/wrapper-gen && cd /tmp/wrapper-gen
          gradle wrapper --gradle-version 8.10.2 --no-daemon
          cp -r gradle "$GITHUB_WORKSPACE/"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Engine unit tests
        if: always()
        run: ./gradlew :engine:test --stacktrace

      - name: Show build errors in run summary
        if: always()
        run: |
          {
            echo '### Build errors (if any)'
            echo '```'
            grep -E -A6 "^e: |What went wrong|FAILURE" build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circles-triangle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: engine/build/reports/tests
          if-no-files-found: ignore
