name: Android CI
on: [push, pull_request, workflow_dispatch]

env:
  GRADLE_BIN: /opt/gradle-8.10.2/bin/gradle

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # AGP 8.7.x needs Gradle 8.x; the runner's preinstalled Gradle is 9.x
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          "$GRADLE_BIN" --version

      - name: Build debug APK
        run: |
          set -o pipefail
          "$GRADLE_BIN" :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Engine unit tests
        if: always()
        run: |
          "$GRADLE_BIN" :engine:test --stacktrace --console=plain

      - name: Show build errors in run summary
        if: always()
        run: |
          {
            echo '### Build errors (if any)'
            echo '```'
            grep -E -A6 "^e: |What went wrong|FAILURE|error:" build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circles-triangle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: engine/build/reports/tests
          if-no-files-found: ignore
