name: Android CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3 fails on the obsolete 'tools' package, so the SDK is configured explicitly.
      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          [ -x "$SDKM" ] || SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: $SDKM"
          # 'yes' receives SIGPIPE once sdkmanager exits; that is expected, so pipefail is off for this line only.
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null
          set -o pipefail
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # AGP 8.7.x needs Gradle 8.x; the runner's preinstalled Gradle is 9.x
      - name: Install Gradle 8.10.2
        run: |
          mkdir -p "$HOME/gradle"
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          python3 -m zipfile -e /tmp/gradle.zip "$HOME/gradle"
          chmod +x "$HOME/gradle/gradle-8.10.2/bin/gradle"
          echo "GRADLE_BIN=$HOME/gradle/gradle-8.10.2/bin/gradle" >> "$GITHUB_ENV"
          "$HOME/gradle/gradle-8.10.2/bin/gradle" --version

      - name: Build APK and run engine tests
        run: |
          set +e
          {
            echo "### Environment"
            echo '```'
            echo "GRADLE_BIN=$GRADLE_BIN"
            "$GRADLE_BIN" --version 2>&1 | head -20
            java -version 2>&1
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          "$GRADLE_BIN" :engine:test :app:assembleDebug --continue --stacktrace --console=plain > build.log 2>&1
          code=$?
          echo "Gradle exit code: $code"
          tail -n 80 build.log

          {
            echo "### Gradle exit code: $code"
            echo '```'
            grep -E -A6 "^e: |What went wrong|FAILURE|error:" build.log | head -80
            echo '--- last 60 lines ---'
            tail -n 60 build.log
            echo '```'
            echo "### APK files found"
            echo '```'
            find . -name "*.apk" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circles-triangle-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: engine/build/reports/tests
          if-no-files-found: ignore
